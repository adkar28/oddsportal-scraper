name: OddsPortal Leagues & Teams Scraper

on:
  # Manuel tetikleme (isteğe bağlı çalıştır)
  workflow_dispatch:
  # İstersen haftalık otomatik çalıştır (her Pazartesi 06:00 UTC)
  # schedule:
  #   - cron: "0 6 * * 1"

jobs:
  scrape-leagues:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Google credentials oluştur
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Scraper'ı çalıştır
        run: python leagues_scraper.py
        env:
          PYTHONUNBUFFERED: "1"
